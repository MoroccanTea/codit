name: labeler

on:
  # codit-safe: CWE-829 pull_request_target used only to label; no checkout or execution of PR code
  pull_request_target:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
