# Production profile (activated with SPRING_PROFILES_ACTIVE=prod)

# codit-safe: CWE-16 only health and info exposed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never



# codit-safe: CWE-16 H2 console explicitly disabled
spring.h2.console.enabled=false



# codit-safe: CWE-209 stack traces never rendered
server.error.include-stacktrace=never
server.error.include-message=never



# codit-safe: CWE-489 debug mode off
debug=false
