spring.application.name=partner-portal
server.port=8080
spring.datasource.url=jdbc:postgresql://db:5432/portal
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# codit-expect: CWE-16 every actuator endpoint (env, heapdump, beans...) exposed over HTTP
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always



# codit-expect: CWE-16 H2 web console enabled (remote SQL console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2



# codit-expect: CWE-209 stack traces included in error responses
server.error.include-stacktrace=always
server.error.include-message=always



# codit-expect: CWE-489 Spring Boot debug mode enabled
debug=true
