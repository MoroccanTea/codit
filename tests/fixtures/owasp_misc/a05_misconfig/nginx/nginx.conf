user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name files.acme.example;
        ssl_certificate     /etc/nginx/tls/files.crt;
        ssl_certificate_key /etc/nginx/tls/files.key;

        location /static/ {
            root /srv/www;
            # codit-safe: CWE-548 listing disabled for static assets
            autoindex off;
        }



        location /backups/ {
            root /srv/www;
            # codit-expect: CWE-548 directory listing of database backups
            autoindex on;
        }
    }
}
