<VirtualHost *:443>
    ServerName intranet.acme.example
    DocumentRoot /var/www/intranet

    <Directory /var/www/intranet>
        # codit-safe: CWE-548 indexes explicitly disabled
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/intranet/backups>
        # codit-expect: CWE-548 auto-generated index of the backups directory
        Options Indexes
        Require all granted
    </Directory>
</VirtualHost>
