user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    autoindex off;   # codit-safe: CWE-548 directory listing disabled globally

    server {
        listen 443 ssl;
        server_name files.acme.example;

        ssl_certificate     /etc/nginx/tls/files.crt;
        ssl_certificate_key /etc/nginx/tls/files.key;

        location /static/ {
            root /srv/www;
            try_files $uri =404;
        }

        location /exports/ {
            alias /srv/exports/;
            autoindex on;   # codit-expect: CWE-548 directory listing of customer exports
            autoindex_exact_size off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            add_header Access-Control-Allow-Origin $http_origin always;   # codit-expect: CWE-942 reflects any Origin together with Allow-Credentials true
            add_header Access-Control-Allow-Credentials true always;
        }

        location /partner/ {
            proxy_pass http://127.0.0.1:8081;
            add_header Access-Control-Allow-Origin https://partner.acme.example always;   # codit-safe: CWE-942 single fixed trusted origin
            add_header Access-Control-Allow-Credentials true always;
        }
    }
}
